<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spin Wheel - ROM Maker</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: linear-gradient(135deg, #11335c, #061933);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .studio-box {
            width: 100%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #f1c40f;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 13px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        textarea {
            height: 140px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #f1c40f;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-export {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 25px;
            background: #e67e22;
            color: white;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-export:active {
            transform: scale(0.98);
        }

        .info-card {
            background: rgba(52, 152, 219, 0.25);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.5;
        }

        /* 🛠 Mobile Optimizations */
        @media (max-width: 480px) {
            .studio-box {
                padding: 18px;
                border-radius: 12px;
            }

            h2 {
                font-size: 1.2rem;
            }

            input[type="text"],
            input[type="number"],
            textarea,
            .btn-export {
                font-size: 14px;
                padding: 10px;
            }

            textarea {
                height: 120px;
            }

            .info-card {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="studio-box">
        <h2>🎡 Spin Wheel ROM Maker</h2>
        <div class="info-card">
            💡 <b>Instructions:</b> Enter your student names or words below (one item per line). This factory will
            automatically generate a game file with the <code>spin_wheel</code> engine identifier.
        </div>

        <label>📌 Enter Game Title:</label>
        <input type="text" id="gameTitle" value="Lucky Student Spin">

        <label>⏱ Default Spin Duration (Seconds):</label>
        <input type="number" id="spinDuration" value="5" min="2" max="60">

        <label>📝 Enter Student Names / Words (One per line):</label>
        <textarea id="wordItems" placeholder="Somchai&#10;Somsri&#10;John Doe"></textarea>

        <button class="btn-export" onclick="exportSpinWheelROM()">📥 Export ROM File (.txt)</button>
    </div>

    <script>
        function exportSpinWheelROM() {
            const title = document.getElementById("gameTitle").value.trim() || "Spin-Wheel";
            const duration = parseInt(document.getElementById("spinDuration").value) || 5;
            const wordsText = document.getElementById("wordItems").value.trim();
            if (!wordsText) { alert("Please enter at least one name or word!"); return; }
            let wordsArray = [];
            wordsText.split('\n').forEach(w => { if (w.trim() !== "") { wordsArray.push(w.trim()); } });
            if (wordsArray.length === 0) { alert("Please enter valid names or words!"); return; }

            const romObject = {
                title: title,
                gameType: "spin_wheel",
                duration: duration,
                pairs: wordsArray.map(w => ({ a: w, b: "" }))
            };

            const dataBlob = new Blob([JSON.stringify(romObject)], { type: "text/plain" });
            const downloader = document.createElement("a");
            downloader.href = URL.createObjectURL(dataBlob);
            downloader.download = `${title}.txt`;
            document.body.appendChild(downloader); downloader.click(); document.body.removeChild(downloader);
        }
    </script>
</body>

</html>
