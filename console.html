<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation 4 - Custom Educational Emulator</title>
    <style>
        /* CSS: PS4 Blue Gradient Theme */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at center, #0a3d70 0%, #03162b 100%);
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        .ps4-bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.15) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            animation: floatGlow 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, 50px) scale(1.2);
            }
        }

        .console-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 40px 60px;
        }

        .ps4-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
        }

        .ps4-user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-dot {
            width: 12px;
            height: 12px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
        }

        .ps4-main-content {
            margin: auto 0;
            position: relative;
        }

        .system-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-carousel {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            padding: 20px 10px;
            min-height: 220px;
            align-items: center;
        }

        .game-carousel::-webkit-scrollbar {
            display: none;
        }

        .insert-disc-card {
            min-width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            box-sizing: border-box;
            padding: 15px;
        }

        .insert-disc-card:hover {
            border-color: #007aff;
            background: rgba(0, 122, 255, 0.1);
            transform: scale(1.03);
        }

        .disc-icon {
            font-size: 44px;
            margin-bottom: 10px;
            animation: spinDisc 4s infinite linear;
        }

        @keyframes spinDisc {
            100% {
                transform: rotate(360deg);
            }
        }

        .ps4-game-card {
            min-width: 180px;
            height: 180px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            box-sizing: border-box;
            cursor: pointer;
            transition: 0.25s;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .ps4-game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.3) 60%, transparent 100%);
            z-index: 1;
        }

        .ps4-game-card:hover {
            border-color: #007aff;
            transform: scale(1.08) translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 122, 255, 0.5), 0 0 15px #007aff;
        }

        .game-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 10px;
            font-weight: bold;
            background: #007aff;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            z-index: 2;
        }

        .game-card-title {
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            z-index: 2;
            position: relative;
        }

        .game-card-type {
            font-size: 10px;
            color: #f1c40f;
            text-transform: uppercase;
            font-weight: bold;
            z-index: 2;
            position: relative;
            margin-top: 3px;
        }

        /* RUNTIME LAYOUT SYSTEM */
        .game-runtime-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .game-arena {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            box-sizing: border-box;
        }

        .match-bg {
            background: radial-gradient(circle at center, #1e2942 0%, #111726 100%);
        }

        .spin-bg {
            background-image: url('https://github.com/kayminn555-rgb/English_games/blob/main/one_piecce_bg.jpg?raw=true'), linear-gradient(to bottom, #11335c, #061933);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* SCOREBOARD SYSTEM */
        .scoreboard {
            display: flex;
            width: 95%;
            max-width: 1200px;
            justify-content: space-between;
            align-items: center;
            background: rgba(44, 62, 80, 0.95);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #ffffff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            z-index: 20;
        }

        .score-side-container {
            display: flex;
            gap: 20px;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }

        .team-score-card {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            width: 300px;
            box-sizing: border-box;
        }

        .team-score-card.active-turn {
            background: #f39c12;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 15px #f39c12;
            transform: scale(1.03);
        }

        .score-num {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-left: 10px;
        }

        .round-info {
            font-size: 1.3rem;
            font-weight: bold;
            background: #34495e;
            padding: 5px 20px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .live-mode-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .live-tab-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .live-tab-btn.active {
            background: #007aff;
        }

        /* ENGINE PACK 3: BEHIND THE CARD GRID */
        .main-content-layout {
            display: none;
            width: 100%;
            height: calc(100% - 160px);
            grid-template-columns: 160px 1fr 160px;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .score-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .control-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            font-size: 2.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
            user-select: none;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .btn-correct {
            background-color: #2ecc71;
            color: white;
        }

        .btn-wrong {
            background-color: #e74c3c;
            color: white;
        }

        .score-control span {
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 🛠 အမှတ်ပြန်လျှော့နိုင်မည့် ခလုတ်ငယ်များအတွက် CSS */
        .btn-minus {
            background-color: #7f8c8d;
            color: white;
            width: 55px;
            height: 35px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            transition: 0.1s;
            margin-top: 2px;
        }

        .btn-minus:active {
            transform: scale(0.9);
        }

        .board-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .grid-board {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 75vh;
            max-height: 55vh;
            min-width: 500px;
            min-height: 380px;
            background: #ffffff;
            border: 6px solid #fff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            overflow: hidden;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
        }

        .hidden-image-holder {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .card-slot {
            position: relative;
            z-index: 2;
            background: transparent;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            font-size: 2.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            outline: 1px solid #2c3e50;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s ease;
            opacity: 1;
            transform: scale(1);
        }

        .card-cover:hover {
            background: linear-gradient(135deg, #34495e, #2c3e50);
        }

        .card-slot.revealed .card-cover {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        /* ENGINE PACK 1: MATCH UP GRID FIELD */
        .matchup-grid-field {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            width: 95%;
            max-width: 1000px;
            margin: auto;
            perspective: 1200px;
            justify-content: center;
        }

        .card-container {
            height: 115px;
            perspective: 1200px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s;
            transform-style: preserve-3d;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-sizing: border-box;
            padding: 8px;
        }

        .card-front {
            background-color: #4a2711;
            background-image: linear-gradient(0deg, #3d1f0d 0%, #573018 100%);
            color: #f1c40f;
            font-size: 32px;
            border: 2px solid #2b1407;
        }

        .card-back {
            background: linear-gradient(135deg, #1abc9c, #2ecc71);
            color: white;
            font-size: 16px;
            transform: rotateY(180deg);
            word-break: break-word;
            overflow: hidden;
            border: 2px solid #ffffff;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: white;
            border-radius: 6px;
        }

        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: bold;
            opacity: 0;
        }

        .feedback-correct {
            color: #2ecc71;
        }

        .feedback-wrong {
            color: #e74c3c;
        }

        .card-container.fall-down .card-inner {
            animation: fallAnim 0.5s forwards;
        }

        @keyframes fallAnim {
            0% {
                transform: rotateY(180deg) translateY(0);
                opacity: 1;
            }

            100% {
                transform: rotateY(180deg) translateY(500px);
                opacity: 0;
            }
        }

        /* ENGINE PACK 2: SPIN WHEEL EMBEDDED FIELD */
        .spin-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            position: relative;
            width: 100%;
            z-index: 10;
        }

        .ferris-wheel-frame {
            position: relative;
            width: 620px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-wrapper {
            position: absolute;
            top: 10px;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            background: #ffffff;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ferris-iron-leg-left {
            position: absolute;
            bottom: -30px;
            left: 165px;
            width: 14px;
            height: 320px;
            background: linear-gradient(to right, #bdc3c7 0%, #ffffff 30%, #95a5a6 70%, #7f8c8d 100%);
            transform: rotate(19deg);
            transform-origin: bottom center;
            z-index: 5;
            border-radius: 4px;
            border: 1px solid #7f8c8d;
            box-shadow: -6px 5px 12px rgba(0, 0, 0, 0.4);
        }

        .ferris-iron-leg-right {
            position: absolute;
            bottom: -30px;
            right: 165px;
            width: 14px;
            height: 320px;
            background: linear-gradient(to right, #bdc3c7 0%, #ffffff 30%, #95a5a6 70%, #7f8c8d 100%);
            transform: rotate(-19deg);
            transform-origin: bottom center;
            z-index: 5;
            border-radius: 4px;
            border: 1px solid #7f8c8d;
            box-shadow: 8px 5px 12px rgba(0, 0, 0, 0.4);
        }

        .leg-foot-left {
            position: absolute;
            bottom: -42px;
            left: 135px;
            width: 36px;
            height: 14px;
            background: linear-gradient(to bottom, #bdc3c7, #7f8d8d);
            border-radius: 3px;
            z-index: 6;
        }

        .leg-foot-right {
            position: absolute;
            bottom: -42px;
            right: 135px;
            width: 36px;
            height: 14px;
            background: linear-gradient(to bottom, #bdc3c7, #7f8d8d);
            border-radius: 3px;
            z-index: 6;
        }

        .wheel-pointer-right {
            position: absolute;
            top: 225px;
            right: -22px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-right: 50px solid #e74c3c;
            z-index: 30;
            filter: drop-shadow(-4px 4px 6px rgba(0, 0, 0, 0.5));
            transition: border-right-color 0.05s ease;
        }

        .center-hub {
            position: absolute;
            top: 225px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffffff 30%, #cbd5e1 70%, #7f8c8d 100%);
            border: 4px solid #95a5a6;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spin-trigger-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 50%, #d35400 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .live-spin-time-box {
            background: rgba(44, 62, 80, 0.95);
            padding: 8px 20px;
            border-radius: 10px;
            border: 2px solid #ffffff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            margin-bottom: 5px;
            z-index: 20;
        }

        .live-spin-time-box input {
            width: 60px;
            padding: 6px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
        }

        /* UNIVERSAL CONTROL NAV BAR BOTTOM */
        .bottom-bar {
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            width: 100%;
            height: 65px;
            box-sizing: border-box;
        }

        .nav-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }

        .nav-btn:hover {
            background: #2980b9;
        }

        .nav-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        .spin-result-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #2c3e50;
            padding: 30px 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 3000;
            border: 4px solid #f1c40f;
            min-width: 280px;
        }

        .spin-result-popup div {
            font-size: 42px;
            font-weight: bold;
            margin-top: 10px;
            color: #e67e22;
        }

        .btn-close-spin-popup {
            margin-top: 20px;
            background: #2c3e50;
            color: white;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .overlay-mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1500;
        }

        .btn-console {
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            background: #e74c3c;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .live-team-config-panel {
            display: none;
            background: #ffffff;
            color: #2c3e50;
            padding: 15px 25px;
            border-radius: 8px;
            width: 95%;
            max-width: 600px;
            margin: 5px auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            z-index: 500;
        }

        .config-row {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .input-box-meta {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .input-box-meta input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-weight: bold;
            font-size: 14px;
            color: #2c3e50;
        }

        .btn-apply-teams {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="ps4-bg-glow"></div>

    <div class="console-wrapper" id="consoleHome">
        <div class="ps4-top-bar">
            <div class="ps4-user-profile">
                <div class="avatar-dot"></div><span>Teacher De Ku & Minn (Online)</span>
            </div>
            <div id="liveClock">07:30 PM</div>
        </div>
        <div class="ps4-main-content">
            <div class="system-title" id="focusedGameTitle">Insert Game Disc</div>
            <div class="game-carousel" id="gameLibraryContainer">
                <div class="insert-disc-card" onclick="document.getElementById('romUploader').click()">
                    <div class="disc-icon">💿</div>
                    <div style="font-weight: bold; font-size: 14px;">Insert Game ROM</div>
                    <input type="file" id="romUploader" style="display:none;" accept=".txt"
                        onchange="loadGameRomConsole(event)">
                </div>
            </div>
        </div>
    </div>

    <div class="game-runtime-overlay" id="runtimeArena">
        <div class="game-arena" id="arenaStyleFrame">

            <div class="scoreboard" id="scoreboardHeader">
                <div class="score-side-container">
                    <div class="team-score-card team-left active-turn" id="scoreCard1"
                        onclick="selectActiveTeamConsole(1)">
                        <span id="displayName1">Team A</span>
                        <span class="score-num" id="scoreNum1">0</span>
                    </div>

                    <div class="round-info" id="roundLabel">Slide 1 / 12</div>

                    <div class="live-mode-switcher" id="classicModeSwitcher">
                        <button class="live-tab-btn active" id="liveTabSolo"
                            onclick="switchLiveMode('solo')">Solo</button>
                        <button class="live-tab-btn" id="liveTabTeam" onclick="switchLiveMode('team')">Team</button>
                    </div>

                    <div class="team-score-card team-right" id="scoreCard2" onclick="selectActiveTeamConsole(2)">
                        <span id="displayName2">Team B</span>
                        <span class="score-num" id="scoreNum2">0</span>
                    </div>
                </div>
            </div>

            <div class="live-team-config-panel" id="liveTeamConfig">
                <div class="config-row">
                    <div class="input-box-meta"><label style="font-weight:bold; font-size:11px;">Team A
                            Name:</label><input type="text" id="team1Input" value="Straw Hats"></div>
                    <div class="input-box-meta"><label style="font-weight:bold; font-size:11px;">Team B
                            Name:</label><input type="text" id="team2Input" value="Beast Pirates"></div>
                    <button class="btn-apply-teams" onclick="applyTeamConfigurationData()">Apply ⚔</button>
                </div>
            </div>

            <div class="main-content-layout" id="behindCardEngineView">
                <div class="score-control">
                    <button class="control-btn btn-correct" onclick="handleScore(true)">✅</button>
                    <span>Correct<br>(+1 Point)</span>
                    <button class="btn-minus" onclick="modifyScoreManual(-1)">-1</button>
                </div>

                <div class="board-container">
                    <div class="grid-board" id="gridBoard">
                        <div class="hidden-image-holder" id="secretImage"></div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">1</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">2</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">3</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">4</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">5</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">6</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">7</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">8</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">9</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">10</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">11</div>
                        </div>
                        <div class="card-slot" onclick="revealCard(this)">
                            <div class="card-cover">12</div>
                        </div>
                    </div>
                </div>

                <div class="score-control">
                    <button class="control-btn btn-wrong" onclick="handleScore(false)">❌</button>
                    <span>Wrong<br>(0 Points)</span>
                    <button class="btn-minus" onclick="modifyScoreManual(-1)">-1</button>
                </div>
            </div>

            <div class="matchup-grid-field" id="matchUpEngineView"></div>

            <div class="spin-container" id="spinWheelEngineView">
                <div class="live-spin-time-box"><span>⏱ Spin Duration:</span><input type="number" id="liveSecondsInput"
                        value="5" min="2" max="60"><span>Seconds</span></div>
                <div class="ferris-wheel-frame">
                    <div class="ferris-iron-leg-left"></div>
                    <div class="ferris-iron-leg-right"></div>
                    <div class="leg-foot-left"></div>
                    <div class="leg-foot-right"></div>
                    <div class="wheel-wrapper">
                        <canvas id="wheelCanvas" width="500" height="500"></canvas>
                        <div class="wheel-pointer-right" id="wheelPointer"></div>
                    </div>
                    <div class="center-hub"><button class="spin-trigger-btn"
                            onclick="triggerConsoleWheelSpin()">SPIN</button></div>
                </div>
            </div>

            <div class="bottom-bar" id="universalControlNavbar">
                <button class="nav-btn" id="prevBtn" onclick="navigateSlide(-1)">⏮ Previous</button>
                <button class="nav-btn" style="background-color: #e67e22;" id="resetGridBtn"
                    onclick="resetCurrentGrid()">🔄 Reset Grid</button>
                <button class="nav-btn" style="background-color: #9b59b6;" id="revealImageBtn"
                    onclick="revealEntireImage()">👁️ Reveal Picture</button>
                <button class="nav-btn" id="nextBtn" onclick="navigateSlide(1)">Next ⏭</button>
                <button class="btn-console" id="exitConsoleBtn" onclick="powerOffCurrentGame()">🎮 Close Game</button>
            </div>
        </div>
    </div>

    <div class="overlay-mask" id="mask"></div>
    <div class="spin-result-popup" id="spinResultBox">
        <h3>Selected Winner</h3>
        <div id="spinResultValue">-</div>
        <button class="btn-close-spin-popup" onclick="closeConsoleSpinPopup()">OK</button>
    </div>

    <script>
        let installedGames = []; let activePairsData = []; let flippedCards = []; let matchesFound = 0; let totalMatches = 0;
        let currentRomObject = null; let gameMode = 'solo'; let activeTurn = 1; let scores = { 1: 0, 2: 0 };
        let wheelSegments = []; let currentRotationAngle = 0; let isSpinning = false; let currentIdx = 0; let isTransitioning = false;

        const segmentColors = ["#1abc9c", "#e67e22", "#3498db", "#2ecc71", "#9b59b6", "#f1c40f", "#34495e", "#e74c3c", "#16a085", "#27ae60", "#2980b9", "#8e44ad"];
        const hidingLayouts = [
            { top: "0%", left: "50%", width: "25%", height: "33.33%" }, { top: "33.33%", left: "75%", width: "25%", height: "33.33%" },
            { top: "66.66%", left: "0%", width: "25%", height: "33.33%" }, { top: "33.33%", left: "25%", width: "25%", height: "33.33%" },
            { top: "0%", left: "0%", width: "50%", height: "33.33%" }, { top: "33.33%", left: "50%", width: "50%", height: "33.33%" },
            { top: "66.66%", left: "25%", width: "50%", height: "33.33%" }, { top: "0%", left: "25%", width: "50%", height: "66.66%" },
            { top: "33.33%", left: "50%", width: "50%", height: "66.66%" }, { top: "33.33%", left: "0%", width: "50%", height: "66.66%" }
        ];
        const rotations = ["rotate(0deg)", "rotate(180deg)", "scaleX(-1)", "scaleY(-1)"];

        const GameCovers = {
            match_up: "https://github.com/kayminn555-rgb/English_games/blob/main/match_up_cover.jpg?raw=true",
            spin_wheel: "https://github.com/kayminn555-rgb/English_games/blob/main/spin_wheel_cover.jpg?raw=true"
        };

        const SoundFX = {
            ctx: null,
            init() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } if (this.ctx.state === 'suspended') this.ctx.resume(); },
            playFlip() { this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(550, this.ctx.currentTime); gain.gain.setValueAtTime(0.04, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.08); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.08); },
            playWin() { this.init(); const t = this.ctx.currentTime; const tone = (f, s, d) => { const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(f, s); g.gain.setValueAtTime(0.05, s); g.gain.linearRampToValueAtTime(0.001, s + d); o.connect(g); g.connect(this.ctx.destination); o.start(s); o.stop(s + d); }; tone(523.25, t, 0.1); tone(659.25, t + 0.1, 0.1); tone(783.99, t + 0.2, 0.3); },
            playLose() { this.init(); const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(150, this.ctx.currentTime); g.gain.setValueAtTime(0.08, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.4); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.4); }
        };

        setInterval(() => { const d = new Date(); document.getElementById("liveClock").innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }, 1000);

        function loadGameRomConsole(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    const rom = JSON.parse(evt.target.result);
                    if (!rom.gameType || !rom.pairs) throw new Error();
                    installedGames.push(rom); renderGameLibraryCarousel();
                    alert(`🎮 "${rom.title.toUpperCase()}" Installed!`);
                } catch (err) { alert("❌ Invalid Game File Format!"); }
            };
            reader.readAsText(file);
        }

        function renderGameLibraryCarousel() {
            const container = document.getElementById("gameLibraryContainer"); container.innerHTML = container.firstElementChild.outerHTML;
            installedGames.forEach((game, index) => {
                const card = document.createElement("div"); card.classList.add("ps4-game-card");
                let coverImg = game.gameType === 'spin_wheel' ? GameCovers.spin_wheel : GameCovers.match_up;
                card.style.backgroundImage = `url('${coverImg}')`;
                card.innerHTML = `<div class="game-badge">Ready</div><div class="game-card-title">${game.title}</div><div class="game-card-type">Engine: ${game.gameType.replace(/_/g, ' ')}</div>`;
                card.onclick = () => bootSelectedGameEngine(index); container.appendChild(card);
            });
            if (installedGames.length > 0) { document.getElementById("focusedGameTitle").innerText = installedGames[installedGames.length - 1].title; }
        }

        function bootSelectedGameEngine(index) {
            currentRomObject = installedGames[index]; activePairsData = currentRomObject.pairs;
            document.getElementById("consoleHome").style.display = "none"; document.getElementById("runtimeArena").style.display = "block";
            scores = { 1: 0, 2: 0 }; activeTurn = 1; document.getElementById("scoreNum1").innerText = "0"; document.getElementById("scoreNum2").innerText = "0";
            document.getElementById("liveTeamConfig").style.display = "none"; currentIdx = 0; isTransitioning = false;

            document.getElementById("matchUpEngineView").style.display = "none";
            document.getElementById("spinWheelEngineView").style.display = "none";
            document.getElementById("behindCardEngineView").style.display = "none";
            document.getElementById("universalControlNavbar").style.display = "none";
            document.getElementById("scoreboardHeader").style.display = "flex";
            document.getElementById("classicModeSwitcher").style.display = "flex";
            document.getElementById("roundLabel").style.display = "none";

            if (currentRomObject.gameType === 'match_up') {
                document.getElementById("arenaStyleFrame").className = "game-arena match-bg";
                document.getElementById("matchUpEngineView").style.display = "grid";
                switchLiveMode('solo');
            } else if (currentRomObject.gameType === 'spin_wheel') {
                document.getElementById("arenaStyleFrame").className = "game-arena spin-bg";
                document.getElementById("spinWheelEngineView").style.display = "flex";
                document.getElementById("scoreboardHeader").style.display = "none";

                // 🛠 Spin Wheel တွင် အောက်ခြေ Close Game ခလုတ်တန်းတစ်ခုလုံး ပေါ်စေရန် ပြင်ဆင်ခြင်း
                document.getElementById("universalControlNavbar").style.display = "flex";
                document.getElementById("prevBtn").style.display = "none";
                document.getElementById("nextBtn").style.display = "none";
                document.getElementById("resetGridBtn").style.display = "none";
                document.getElementById("revealImageBtn").style.display = "none";
                document.getElementById("exitConsoleBtn").style.display = "block";

                if (currentRomObject.duration) document.getElementById("liveSecondsInput").value = currentRomObject.duration;
                wheelSegments = activePairsData.map(p => p.a); currentRotationAngle = 0; drawConsoleWheelGraphic(0);
            } else if (currentRomObject.gameType === 'behind_the_card') {
                document.getElementById("arenaStyleFrame").className = "game-arena match-bg";
                document.getElementById("behindCardEngineView").style.display = "grid";
                document.getElementById("scoreboardHeader").style.display = "grid";
                document.getElementById("classicModeSwitcher").style.display = "none";
                document.getElementById("roundLabel").style.display = "block";
                document.getElementById("universalControlNavbar").style.display = "flex";

                document.getElementById("prevBtn").style.display = "block";
                document.getElementById("nextBtn").style.display = "block";
                document.getElementById("resetGridBtn").style.display = "block";
                document.getElementById("revealImageBtn").style.display = "block";
                document.getElementById("exitConsoleBtn").style.display = "block";

                switchLiveMode('team');
                loadBehindCardRound(currentIdx);
            }
        }

        function switchLiveMode(mode) {
            gameMode = mode;
            document.getElementById("liveTabSolo").classList.toggle("active", mode === 'solo');
            document.getElementById("liveTabTeam").classList.toggle("active", mode === 'team');
            if (mode === 'solo') {
                document.getElementById("liveTeamConfig").style.display = "none";
                document.getElementById("displayName1").innerText = "Player Score";
                document.getElementById("scoreCard2").style.display = "none";
                activeTurn = 1; updateConsoleTurnUI();
            } else {
                if (currentRomObject && currentRomObject.gameType !== 'behind_the_card') {
                    document.getElementById("liveTeamConfig").style.display = "block";
                }
                document.getElementById("scoreCard2").style.display = "flex";
                updateConsoleTurnUI();
            }
        }

        function applyTeamConfigurationData() {
            document.getElementById("displayName1").innerText = document.getElementById("team1Input").value.trim() || "Team A";
            document.getElementById("displayName2").innerText = document.getElementById("team2Input").value.trim() || "Team B";
            document.getElementById("liveTeamConfig").style.display = "none";
            updateConsoleTurnUI();
        }

        function selectActiveTeamConsole(teamNum) {
            if (gameMode === 'solo') return;
            activeTurn = teamNum;
            SoundFX.playFlip();
            updateConsoleTurnUI();
        }

        function updateConsoleTurnUI() {
            document.getElementById("scoreCard1").classList.toggle("active-turn", activeTurn === 1);
            if (document.getElementById("scoreCard2")) {
                document.getElementById("scoreCard2").classList.toggle("active-turn", activeTurn === 2);
            }
        }

        function handleScore(isCorrect) {
            if (isCorrect) {
                scores[activeTurn]++;
                document.getElementById(`scoreNum${activeTurn}`).innerText = scores[activeTurn];
                SoundFX.playWin();
            } else {
                SoundFX.playLose();
            }
        }

        /* 🛠 အမှတ်မှားနှိပ်မိပါက လက်တန်းပြန်နုတ်နိုင်မည့် Logic အသစ် */
        function modifyScoreManual(amount) {
            scores[activeTurn] += amount;
            if (scores[activeTurn] < 0) scores[activeTurn] = 0; // အမှတ်ကို ဝက်အောက် အနုတ်မဖြစ်စေရန် ညှိခြင်း
            document.getElementById(`scoreNum${activeTurn}`).innerText = scores[activeTurn];
            SoundFX.playFlip();
        }

        /* ---------------- ENGINE 3 CORE LOGICS (BEHIND THE CARD) ---------------- */
        function loadBehindCardRound(idx) {
            document.getElementById('roundLabel').innerText = `Slide ${idx + 1} / ${activePairsData.length}`;
            const imgHolder = document.getElementById('secretImage');
            imgHolder.style.backgroundImage = `url('${activePairsData[idx].a}')`;

            const randomLayout = hidingLayouts[Math.floor(Math.random() * hidingLayouts.length)];
            imgHolder.style.top = randomLayout.top; imgHolder.style.left = randomLayout.left;
            imgHolder.style.width = randomLayout.width; imgHolder.style.height = randomLayout.height;

            const randomRotation = rotations[Math.floor(Math.random() * rotations.length)];
            imgHolder.style.transform = randomRotation;

            document.getElementById('prevBtn').disabled = (idx === 0);
            document.getElementById('nextBtn').disabled = (idx === activePairsData.length - 1);
            resetCurrentGrid();
        }

        function revealCard(slotElement) { if (isTransitioning) return; SoundFX.playFlip(); slotElement.classList.add('revealed'); }
        function resetCurrentGrid() { document.querySelectorAll('.card-slot').forEach(s => s.classList.remove('revealed')); }
        function revealEntireImage() { document.querySelectorAll('.card-slot').forEach(s => s.classList.add('revealed')); }

        function navigateSlide(dir) {
            if (isTransitioning) return; isTransitioning = true;
            const board = document.getElementById('gridBoard');
            resetCurrentGrid();
            setTimeout(() => { board.style.opacity = '0'; }, 400);
            setTimeout(() => {
                currentIdx += dir;
                if (currentIdx >= 0 && currentIdx < activePairsData.length) { loadBehindCardRound(currentIdx); }
                board.style.opacity = '1'; isTransitioning = false;
            }, 800);
        }

        /* ---------------- ENGINE 1 LOGICS (MATCH UP) ---------------- */
        function runMatchUpEngineView() {
            const board = document.getElementById("matchUpEngineView"); board.innerHTML = ""; flippedCards = []; matchesFound = 0; totalMatches = activePairsData.length;
            let cards = []; activePairsData.forEach((pair, idx) => { cards.push({ id: idx, text: pair.a }); cards.push({ id: idx, text: pair.b }); }); cards.sort(() => Math.random() - 0.5);
            cards.forEach((data, index) => {
                const container = document.createElement("div"); container.classList.add("card-container"); container.dataset.id = data.id; const inner = document.createElement("div"); inner.classList.add("card-inner"); const front = document.createElement("div"); front.classList.add("card-face", "card-front"); front.innerText = index + 1; const back = document.createElement("div"); back.classList.add("card-face", "card-back");
                let trimmedText = data.text.trim(); if (trimmedText.startsWith("http://") || trimmedText.startsWith("https://") || trimmedText.startsWith("data:image")) { back.innerHTML = `<img src="${trimmedText}">`; } else { back.innerText = data.text; }
                const cO = document.createElement("div"); cO.classList.add("feedback-overlay", "feedback-correct"); cO.innerText = "✓"; const wO = document.createElement("div"); wO.classList.add("feedback-overlay", "feedback-wrong"); wO.innerText = "✗"; back.appendChild(cO); back.appendChild(wO); inner.appendChild(front); inner.appendChild(back); container.appendChild(inner);
                container.onclick = function () { if (container.classList.contains("is-flipped") || container.classList.contains("fall-down") || flippedCards.length === 2) return; SoundFX.playFlip(); container.classList.add("is-flipped"); flippedCards.push(container); if (flippedCards.length === 2) { setTimeout(checkMatchLogicConsole, 400); } }; board.appendChild(container);
            });
        }

        function checkMatchLogicConsole() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.id === c2.dataset.id) {
                c1.querySelector(".feedback-correct").style.opacity = "1"; c2.querySelector(".feedback-correct").style.opacity = "1"; SoundFX.playWin(); scores[activeTurn]++; document.getElementById(`scoreNum${activeTurn}`).innerText = scores[activeTurn]; matchesFound++;
                setTimeout(() => { c1.classList.add("fall-down"); c2.classList.add("fall-down"); flippedCards = []; if (matchesFound === totalMatches) { alert("🏆 Game Completed!"); powerOffCurrentGame(); } }, 600);
            } else {
                c1.querySelector(".feedback-wrong").style.opacity = "1"; c2.querySelector(".feedback-wrong").style.opacity = "1"; SoundFX.playLose();
                setTimeout(() => { c1.querySelector(".feedback-wrong").style.opacity = "0"; c2.querySelector(".feedback-wrong").style.opacity = "0"; c1.classList.remove("is-flipped"); c2.classList.remove("is-flipped"); flippedCards = []; }, 1000);
            }
        }

        /* ---------------- ENGINE 2 LOGICS (SPIN WHEEL) ---------------- */
        function drawConsoleWheelGraphic(currentRotationRad) {
            const canvas = document.getElementById("wheelCanvas"); const ctx = canvas.getContext("2d"); ctx.clearRect(0, 0, 500, 500);
            const numSegs = wheelSegments.length; const arcSize = (2 * Math.PI) / numSegs;
            ctx.save(); ctx.translate(250, 250); ctx.rotate(currentRotationRad);
            for (let i = 0; i < numSegs; i++) {
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 245, i * arcSize, (i + 1) * arcSize);
                let colorIdx = i; if (numSegs % 2 !== 0 && i === numSegs - 1) { colorIdx = 4; }
                ctx.fillStyle = segmentColors[colorIdx % segmentColors.length]; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = "#ffffff"; ctx.stroke();
                ctx.save(); ctx.rotate((i + 0.5) * arcSize); ctx.fillStyle = "white";
                let text = wheelSegments[i]; let fontSize = 16; if (text.length > 12) fontSize = 13; if (text.length > 20) fontSize = 11;
                ctx.font = `bold ${fontSize}px sans-serif`; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(text, 225, 0); ctx.restore();
            }
            ctx.restore();
            const grad = ctx.createRadialGradient(250, 250, 20, 250, 250, 245); grad.addColorStop(0, 'rgba(255,255,255,0.05)'); grad.addColorStop(1, 'rgba(0,0,0,0.3)'); ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(250, 250, 245, 0, Math.PI * 2); ctx.fill();
            let normalizedAngle = (2 * Math.PI - (currentRotationRad % (2 * Math.PI))) % (2 * Math.PI);
            let targetIdx = Math.floor(normalizedAngle / arcSize); if (targetIdx < 0 || targetIdx >= numSegs) targetIdx = 0;
            let finalColorIdx = targetIdx; if (numSegs % 2 !== 0 && targetIdx === numSegs - 1) { finalColorIdx = 4; }
            document.getElementById("wheelPointer").style.borderRightColor = segmentColors[finalColorIdx % segmentColors.length];
            return targetIdx;
        }

        function triggerConsoleWheelSpin() {
            if (isSpinning || wheelSegments.length === 0) return; isSpinning = true; SoundFX.init();
            let spinSeconds = parseFloat(document.getElementById("liveSecondsInput").value) || 5;
            let totalDurationMs = spinSeconds * 1000; let startTimestamp = null;
            let startAngle = currentRotationAngle % (2 * Math.PI);
            let totalRotationToTarget = (Math.PI * 2 * 12) + (Math.random() * Math.PI * 2); let lastIdx = -1;

            function stepAnimateWheelTime(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp; let elapsed = timestamp - startTimestamp;
                let t = elapsed / totalDurationMs; if (t > 1) t = 1;
                let easeOutProgression = 1 - Math.pow(1 - t, 3);
                let currentRad = startAngle + (totalRotationToTarget * easeOutProgression);
                let liveActiveWinnerIdx = drawConsoleWheelGraphic(currentRad);
                if (liveActiveWinnerIdx !== lastIdx) {
                    try {
                        const osc = SoundFX.ctx.createOscillator(); const gain = SoundFX.ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(550, SoundFX.ctx.currentTime); gain.gain.setValueAtTime(0.04, SoundFX.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, SoundFX.ctx.currentTime + 0.02); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.02);
                    } catch (e) { } lastIdx = liveActiveWinnerIdx;
                }
                if (elapsed < totalDurationMs) { requestAnimationFrame(stepAnimateWheelTime); } else { isSpinning = false; currentRotationAngle = currentRad; SoundFX.playWin(); document.getElementById("spinResultValue").innerText = wheelSegments[liveActiveWinnerIdx]; document.getElementById("mask").style.display = "block"; document.getElementById("spinResultBox").style.display = "block"; }
            }
            requestAnimationFrame(stepAnimateWheelTime);
        }

        function closeConsoleSpinPopup() { document.getElementById("mask").style.display = "none"; document.getElementById("spinResultBox").style.display = "none"; }
        function powerOffCurrentGame() { document.getElementById("consoleHome").style.display = "flex"; document.getElementById("runtimeArena").style.display = "none"; }
    </script>
