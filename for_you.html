<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        /* လှုပ်ရှားနေတဲ့ ကာတွန်းစတစ်ကာ Container */
        .gif-container img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h2 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 30px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 180px; 
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: absolute;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            z-index: 10; 
            left: 15%;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            z-index: 5;
            right: 15%;
        }

        .success-message {
            display: none;
            color: #d63384;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
        }

        /* Yes နှိပ်ပြီးမှ စာသားအပေါ်မှာ ပေါ်လာမယ့် စတစ်ကာ style */
        #successGif {
            display: none;
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="gif-container" id="mainGifContainer">
            <img id="gif" src="https://media.tenor.com/U5dwyJecd-gAAAAm/cat.webp.gif" alt="Cute Sticker">
        </div>

        <h2 id="question">မောင့်ကို စိတ်ဆိုး ပြေပြီလား လို့? 🥺</h2>

        <div class="btn-container" id="btnGroup">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onclick="sayNo()">No</button>
        </div>

        <img id="successGif" src="" alt="Success Celebration Sticker">

        <div id="successBox" class="success-message">
            Thank you for your Kindness. I will try my best for you my love. I love you so much ❤️🥰
        </div>
    </div>

    <script>
        const token = "8615906916:AAHJaj7hSDCkHLPLIsaAfXMI8la3Tk_40bs";
        const chatId = "6258735312";

        let clickCount = 0;
        let yesSize = 18;
        let paddingX = 25;
        let paddingY = 12;

        // မေးခွန်းတွဲများနှင့် စတစ်ကာများ
        const stages = [
            { q: "Can you forgive me? 🥺👉👈", gif: "https://media.tenor.com/ZKDKcI-tQ_YAAAAm/happy-taps.webp.gif" },
            { q: "Do you love me my love? 💖", gif: "https://media.tenor.com/GkVtcIF8IA8AAAAm/tkthao219-bubududu.webp.gif" }
        ];

        function sayNo() {
            clickCount++;
            
            if (clickCount <= stages.length) {
                // မေးခွန်းတွေ မပြီးသေးခင်မှာ Yes ခလုတ်ကို နည်းနည်းစီပဲ ကြီးခိုင်းထားပြီး No ကို ဖုံးမသွားစေရပါဘူး
                yesSize += 8; 
                paddingX += 10;
                paddingY += 4;
                
                const yesBtn = document.getElementById('yesBtn');
                yesBtn.style.fontSize = yesSize + 'px';
                yesBtn.style.padding = paddingY + 'px ' + paddingX + 'px';

                // မေးခွန်းနဲ့ စတစ်ကာ ပြောင်းလဲခြင်း
                const currentStage = stages[clickCount - 1];
                document.getElementById('question').innerText = currentStage.q;
                document.getElementById('gif').src = currentStage.gif;
            } 
            
            // မေးခွန်းတွေအကုန်ပတ်ပြီးလို့ နောက်ဆုံးအဆင့် ရောက်သွားပြီဆိုမှ No ကို ကာပစ်မှာပါ
            if (clickCount > stages.length) {
                const yesBtn = document.getElementById('yesBtn');
                
                // Yes ခလုတ်ကို တစ်ချက်တည်းနဲ့ အဆမတန်ကြီးအောင် လုပ်ပြီး No ကို အုပ်ပစ်လိုက်တာပါ
                yesBtn.style.fontSize = '60px';
                yesBtn.style.padding = '40px 80px';
                yesBtn.style.left = '50%';
                yesBtn.style.top = '50%';
                yesBtn.style.transform = 'translate(-50%, -50%)';
                yesBtn.style.width = '100%';
                yesBtn.style.height = '100%';
                yesBtn.style.borderRadius = '20px';

                document.getElementById('noBtn').style.opacity = '0';
                document.getElementById('noBtn').style.pointerEvents = 'none';
            }
        }

        function sayYes() {
            // UI ပြောင်းလဲခြင်း (မေးခွန်းဟောင်းတွေ ဖျောက်တာ)
            document.getElementById('question').style.display = 'none';
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('mainGifContainer').style.display = 'none'; 

            // 🛠️ Error ပြင်ဆင်ပြီးကြောင်း (style တစ်ခုပဲ သုံးထားပါတယ်)
            document.getElementById('successGif').src = "https://media.tenor.com/Zrr4L_Wd4JkAAAAm/bubu-rub-bubu-love-dudu.webp.gif"; 
            document.getElementById('successGif').style.display = 'block'; 
            
            document.getElementById('successBox').style.display = 'block'; 

            // Telegram Bot ဆီ Alert ပို့ခြင်း
            const message = `🎉 သတင်းကောင်း! ကောင်မလေး စိတ်ဆိုးပြေသွားပါပြီ။ 🥰\nသူ Yes နှိပ်လိုက်ပါပြီဗျာ!`;
            const telegramUrl = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            fetch(telegramUrl)
                .then(response => console.log('Notification sent to Telegram!'))
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
